name: Deploy to ECR and EC2



on:

  push:

    branches: [ "main", "develop" ]



jobs:

  build-and-push:

    runs-on: ubuntu-latest



    steps:

    - name: 체크아웃 (코드 가져오기)

      uses: actions/checkout@v3



    - name: JDK 17 설치 (Java 환경 세팅)

      uses: actions/setup-java@v3

      with:

        java-version: '17'

        distribution: 'temurin'



    - name: gradlew 실행 권한 부여

      run: chmod +x ./gradlew



    - name: Gradle로 빌드 (테스트 제외)

      run: ./gradlew build -x test



    - name: AWS 자격 증명 설정 (ECR 업로드용)

      uses: aws-actions/configure-aws-credentials@v2

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ secrets.AWS_REGION }}



    - name: Amazon ECR 로그인

      id: login-ecr

      uses: aws-actions/amazon-ecr-login@v1



    - name: Docker 이미지 빌드 및 ECR로 푸시

      env:

        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        ECR_REPOSITORY: hufs-dns-server

        IMAGE_TAG: latest

      run: |

        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG



    # 자동 배포' 단계

    - name: EC2에 배포 (SSH 접속)

      uses: appleboy/ssh-action@master

      with:

        host: ${{ secrets.EC2_HOST }}     

        username: ubuntu                  

        key: ${{ secrets.EC2_SSH_KEY }}    

        script: |

          # 1. AWS ECR 로그인 (토큰 갱신)

          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 365202715959.dkr.ecr.ap-northeast-2.amazonaws.com

          

          # 2. 최신 이미지 받기

          docker pull 365202715959.dkr.ecr.ap-northeast-2.amazonaws.com/hufs-dns-server:latest

          

          # 3. 기존 컨테이너 멈추고 삭제 (에러 무시)

          docker stop my-server || true

          docker rm my-server || true

          

          # 4. 새 컨테이너 실행

          docker run -d -p 8080:8080 --name my-server 365202715959.dkr.ecr.ap-northeast-2.amazonaws.com/hufs-dns-server:latest

          

          # 5. 안 쓰는 구버전 이미지 정리 (용량 절약)

          docker image prune -f
