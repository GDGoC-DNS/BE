name: "문서"
description: "문서 변경"
title: "[DOC] "
labels: ["doc"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "작업 내용"
      description: "어떤 문서를 수정하나요?"
      placeholder: "README 업데이트"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "대상"
      description: "파일/섹션 범위"
      placeholder: "README.md, API 문서"
  - type: textarea
    id: outline
    attributes:
      label: "내용 개요"
      description: "간단한 목차나 초안"
      value: "- ..."
